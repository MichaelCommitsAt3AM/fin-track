# Runs on every push and pull request to main: unit tests + debug builds of both flavors.
# Uses a placeholder Firebase config, so no secrets are needed (PRs from forks work too).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an older run when new commits are pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle dependencies and build outputs between runs
      - uses: gradle/actions/setup-gradle@v4

      - name: Use placeholder Firebase config
        run: cp .github/ci/google-services.placeholder.json app/google-services.json

      - name: Unit tests
        run: ./gradlew testStoreDebugUnitTest testPersonalDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew assembleStoreDebug assemblePersonalDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
